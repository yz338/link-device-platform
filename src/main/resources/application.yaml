spring:
  application:
    name: device-management
  datasource:
    # 使用环境变量便于学生按自己的 MySQL 账号调整，不在代码中写死真实密码。
    url: ${DEVICE_DB_URL:jdbc:mysql://127.0.0.1/device_management_hy?serverTimezone=Asia/Shanghai&useSSL=false&characterEncoding=utf8}
    username: ${DEVICE_DB_USERNAME:root}
    password: ${DEVICE_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${DEVICE_REDIS_HOST:localhost}
      port: ${DEVICE_REDIS_PORT:6379}
      database: ${DEVICE_REDIS_DATABASE:0}
  jackson:
    # 统一 LocalDateTime 的序列化/反序列化格式
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # 上传图片的大小限制：单张 5MB，一次请求合计 20MB
      max-file-size: 5MB
      max-request-size: 20MB
  mail:
    # 站内通知同步发邮件的 SMTP 配置；未填写时 JavaMailSender 不会被装配，邮件同步自动跳过。
    # 示例（QQ 邮箱）：host=smtp.qq.com port=465 username=xxx@qq.com password=邮箱授权码（非登录密码）
    host: ${DEVICE_MAIL_HOST:smtp.qq.com}
    port: ${DEVICE_MAIL_PORT:465}
    username: ${DEVICE_MAIL_USERNAME:12345678954@qq.com}
    password: ${DEVICE_MAIL_PASSWORD:123456}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            required: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  jwt:
    # 教学环境默认密钥；部署时必须通过 DEVICE_JWT_SECRET 覆盖。
    secret: ${DEVICE_JWT_SECRET:device-management-course-jwt-secret-change-in-production-2026}
    expire-seconds: 7200
    refresh-expire-seconds: 604800
